[package]
name = "merge-app"
default-run = "merge-app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
humantime = "2.4.0"
hmac = "0.13.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
time = { version = "0.3.55", default-features = false, features = ["parsing", "std"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
